name: Android Companion Build, Test & APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-companion.yml"
  push:
    branches: [main, feature/jarvis-next-phase]
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-companion.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: "8.11.1"
      - name: Run Unit Tests, Lint & Build Debug APK
        working-directory: mobile/android
        run: gradle testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: Generate APK SHA-256 Checksum
        working-directory: mobile/android/app/build/outputs/apk/debug
        run: sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Upload Development APK and Checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarvis-companion-debug-apk
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/apk/debug/SHA256SUMS.txt
