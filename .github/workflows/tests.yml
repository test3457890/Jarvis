name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Build Command Center frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - run: node --experimental-strip-types --test tests/visualEvents.test.ts
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarvis-command-center-built-assets
          path: jarvis/static/cc/
          if-no-files-found: error

  pytest:
    name: Python 3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # Upgrade tests extract v1.1.1 and v1.2.1 from tags.
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check updater syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "upgrade.ps1"), [ref]$tokens, [ref]$errors
          )
          if ($errors.Count) { $errors | Out-String | Write-Error; exit 1 }
      - name: Check installer and diagnostic syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in @("install.ps1", "scripts/check_defender.ps1")) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count) { $errors | Out-String | Write-Error; exit 1 }
          }
      - run: python -m pip install "pytest>=8,<10" "Pillow>=10.4" "pypdf>=5,<7" "python-docx>=1.1,<2" "numpy>=1.26" "playwright>=1.40" "pyttsx3>=2.90"
      - run: python -m playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: python -m playwright install chromium
        if: runner.os == 'Windows'
      - run: python -m pytest -q
      - run: python -m scripts.package_release

  windows-install:
    name: Full Windows install and first launch
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install packages and shortcut without models
        shell: pwsh
        run: ./install.ps1 -Profile low-memory
      - name: Start the HUD and check the first-run wizard
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".venv\Scripts\python.exe" -ArgumentList "-m","jarvis","--no-voice","--no-browser" -PassThru
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 1
              try { $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/; $ok = $true; break } catch {}
            }
            if (-not $ok) { throw "The HUD did not start." }
            if ($page.Content -notmatch 'id="wizard"') { throw "The setup wizard is missing from the HUD." }
          } finally { Stop-Process -Id $process.Id -Force }
      - run: python -m scripts.package_release

  rust-core:
    name: Rust jarvis-core policy verifier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: cargo test --locked --manifest-path rust/jarvis-core/Cargo.toml

  hud:
    name: Capture HUD examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install playwright "Pillow>=10.4" "numpy>=1.26"
      - run: python -m playwright install --with-deps chromium
      - run: python -m scripts.capture_hud
      - name: Exercise every HUD control
        run: python -m scripts.hud_control_audit
      - name: Audit modern Command Center and capture synthetic canvas
        run: python -m scripts.command_center_audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarvis-hud-screenshots
          path: |
            hud-captures/*.png
            hud-captures/control-report.md
            docs/screenshots/command-center-intelligence-canvas.png
          if-no-files-found: error
